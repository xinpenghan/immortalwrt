name: Build ImmortalWrt for DW33D (NOR)

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-distutils unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-12 antlr3 gperf wget curl rsync swig libtinfo5
          sudo -E apt-get -y autoremove --purge
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          git checkout openwrt-23.05
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Detect correct NOR device name
        id: detect_device
        run: |
          cd immortalwrt
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          make defconfig > /dev/null 2>&1
          
          DEVICE_NAME=$(grep -o 'CONFIG_TARGET_ath79_generic_DEVICE_[a-zA-Z0-9_-]*' .config | grep -i 'dw33d' | head -n 1 | sed 's/CONFIG_TARGET_ath79_generic_DEVICE_//')
          
          if [ -z "$DEVICE_NAME" ]; then
            echo "❌ 错误：在 ath79/generic (NOR) 平台下没有找到 DW33D 的设备支持！"
            exit 1
          fi
          
          echo "✅ 找到设备真实名称: $DEVICE_NAME"
          echo "DEVICE=$DEVICE_NAME" >> $GITHUB_OUTPUT

      - name: Apply custom config
        run: |
          cd immortalwrt
          DEVICE="${{ steps.detect_device.outputs.DEVICE }}"
          
          echo "CONFIG_TARGET_ath79_generic_DEVICE_$DEVICE=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          
          make defconfig

      - name: Download packages
        run: |
          cd immortalwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s

      - name: Prepare artifacts
        run: |
          cd immortalwrt
          mkdir -p upload
          find bin/targets/ -type f -name "*.bin" -o -name "*.tar.gz" | xargs -I {} cp {} upload/
          cp .config upload/config.backup

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-DW33D-NOR
          path: immortalwrt/upload/
