name: Build OpenWrt for Xiaomi Mi Router 3G

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: "https://github.com/xinpenghan/immortalwrt"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-12 gperf wget curl rsync swig libncurses-dev
          sudo -E apt-get -y autoremove --purge
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUP /workdir

      - name: Clone Source Code
        run: |
          git clone -b $REPO_BRANCH $REPO_URL /workdir/openwrt
          cd /workdir/openwrt
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --format=%cd --date=short)" >> $GITHUB_ENV

      - name: Update Feeds
        run: |
          cd /workdir/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Third-Party Feeds (For PassWall)
        run: |
          cd /workdir/openwrt
          # 添加 kenzo 的 packages 源，包含 PassWall 和其他常用插件
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          
          # 更新并安装新添加的 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration (Optimized for Mi Router 3G 128MB)
        run: |
          cd /workdir/openwrt
          
          cat > .config <<EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y
          
          # 基础 LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          
          # --- 插件配置 ---
          
          # 1. Turbo ACC (网络加速) - 如果空间不足，建议先删除此项
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_kmod-shortcut-fe-cm=y
          CONFIG_PACKAGE_kmod-shortcut-fe=y
          CONFIG_PACKAGE_kmod-fast-classifier=y
          CONFIG_PACKAGE_kmod-oaf=y
          
          # 2. Watchcat (看门狗)
          CONFIG_PACKAGE_luci-app-watchcat=y
          
          # 3. DDNS (原生动态域名) - 推荐，体积小
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts_aliyun=y
          CONFIG_PACKAGE_ddns-scripts_dnspod=y
          
          # 4. PassWall (科学上网) - 核心部分
          CONFIG_PACKAGE_luci-app-passwall=y
          
          # PassWall 必须的核心后端 (Server Plugins)
          CONFIG_PACKAGE_passwall=y
          CONFIG_PACKAGE_xray-core=y          # Xray 核心
          CONFIG_PACKAGE_sing-box=y           # Sing-box 核心
          CONFIG_PACKAGE_chinadns-ng=y        # DNS 分流核心
          CONFIG_PACKAGE_dns2socks=y          # DNS over Socks5
          CONFIG_PACKAGE_dns2tcp=y            # DNS over TCP
          
          # 常用协议支持 (根据需求开启，全开可能爆闪存)
          CONFIG_PACKAGE_hysteria=y           # Hysteria 协议
          CONFIG_PACKAGE_shadowsocks-rust=y   # SS-Rust
          CONFIG_PACKAGE_shadowsocksr-libev=y # SSR
          CONFIG_PACKAGE_trojan-plus=y        # Trojan
          CONFIG_PACKAGE_v2ray-plugin=y       # V2Ray Plugin
          
          # 以下协议若不需要可注释掉以节省空间 (小米3G 建议精简)
          # CONFIG_PACKAGE_naiveproxy is not set
          # CONFIG_PACKAGE_simple-obfs is not set
          
          # 其他基础工具
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          EOF
          
          make defconfig

      - name: Download Packages
        run: |
          cd /workdir/openwrt
          # 增加重试机制
          make download -j$(nproc) V=s || make download -j1 V=s
          find dl -size -100c -exec ls -l {} \;
          find dl -size -100c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd /workdir/openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_STATUS=$?" >> $GITHUB_ENV

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        if: env.COMPILE_STATUS == '0'
        with:
          name: Xiaomi_Mi_Router_3G_Firmware_${{ env.COMMIT_DATE }}
          path: /workdir/openwrt/bin/targets/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Check Firmware Size
        if: env.COMPILE_STATUS == '0'
        run: |
          cd /workdir/openwrt/bin/targets/ramips/mt7621
          echo "--- Firmware Files ---"
          ls -lh *.bin
          echo "--- Size Check ---"
          SIZE=$(stat -c%s "openwrt-ramips-mt7621-xiaomi_mi-router-3g-squashfs-sysupgrade.bin" 2>/dev/null || echo "0")
          MAX_SIZE=$((128 * 1024 * 1024)) # 128 MB
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Firmware size ($SIZE bytes) exceeds 128MB limit! It may not be flashable."
          else
            echo "Firmware size is within limits."
          fi
