name: Build OpenWrt for Xiaomi Mi Router 3G (Optimized)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  # 强制使用 Node.js 24，解决弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_URL: "https://github.com/xinpenghan/immortalwrt"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-12 gperf wget curl rsync swig libncurses-dev
          sudo -E apt-get -y autoremove --purge
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone Source Code
        run: |
          git clone -b $REPO_BRANCH $REPO_URL /workdir/openwrt
          cd /workdir/openwrt
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --format=%cd --date=short)" >> $GITHUB_ENV

      - name: Update Feeds
        run: |
          cd /workdir/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Third-Party Feeds (For PassWall)
        run: |
          cd /workdir/openwrt
          # 添加 kenzo 的 packages 源
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          
          # 更新并安装新添加的 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration (Extreme Optimized for 128MB Flash)
        run: |
          cd /workdir/openwrt
          
          cat > .config <<EOF
          # --- 目标平台 ---
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y
          
          # --- 全局构建设置 (精简核心) ---
          # 1. 去掉调试符号
          CONFIG_DEBUG_INFO=n
          CONFIG_KERNEL_DEBUG_INFO=n
          CONFIG_KERNEL_STACK_USAGE=n
          
          # 2. 不单独打包内核模块 (集成到内核中，节省 overhead)
          # 注意：在 OpenWrt 中，这通常意味着我们不选择大量的 kmod-xxx 包，而是让内核包含必要驱动
          CONFIG_ALL_KMODS=n
          
          # --- LuCI 基础与语言精简 ---
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-en=y
          # 显式禁用其他语言包以节省空间
          # CONFIG_PACKAGE_luci-i18n-base-de is not set
          # CONFIG_PACKAGE_luci-i18n-base-fr is not set
          
          # --- 主题精简 ---
          # 只保留默认主题 (bootstrap)，移除 material/argon 等
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          # CONFIG_PACKAGE_luci-theme-material is not set
          # CONFIG_PACKAGE_luci-theme-argon is not set
          
          # --- 插件配置 (极致精简版) ---
          
          # 1. Turbo ACC (网络加速) - 保留核心加速，移除 OAF (应用过滤) 以省空间
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_kmod-shortcut-fe-cm=y
          CONFIG_PACKAGE_kmod-shortcut-fe=y
          CONFIG_PACKAGE_kmod-fast-classifier=y
          # CONFIG_PACKAGE_kmod-oaf is not set  <-- 已移除，太占空间
          
          # 2. Watchcat (看门狗) 
          CONFIG_PACKAGE_luci-app-watchcat=y
          
          # 3. DDNS (原生动态域名)
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts_aliyun=y
          CONFIG_PACKAGE_ddns-scripts_dnspod=y
          
          # 4. PassWall (科学上网) - 仅保留最核心和高效的组件
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_passwall=y
          
          # 核心后端：Xray 和 Sing-box 是目前最高效的
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          
          # 必要的辅助工具
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_dns2tcp=y
          
          # 协议支持：仅保留最常用的，移除重型协议
          CONFIG_PACKAGE_shadowsocks-rust=y   # SS-Rust (高效)
          CONFIG_PACKAGE_trojan-plus=y        # Trojan+ (高效)
          # CONFIG_PACKAGE_hysteria is not set       <-- 移除，节省空间
          # CONFIG_PACKAGE_shadowsocksr-libev is not set <-- 移除，SSR 已过时且占空间
          # CONFIG_PACKAGE_v2ray-plugin is not set     <-- 移除，由 Xray 替代
          # CONFIG_PACKAGE_naiveproxy is not set       <-- 移除
          
          # --- 其他基础工具 ---
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          
          # --- 额外精简：移除不必要的默认包 ---
          # CONFIG_PACKAGE_ipv6helper is not set  # 如果不需要 IPv6 辅助脚本
          EOF
          
          make defconfig

      - name: Download Packages
        run: |
          cd /workdir/openwrt
          make download -j$(nproc) V=s || make download -j1 V=s
          find dl -size -100c -exec ls -l {} \;
          find dl -size -100c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd /workdir/openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_STATUS=$?" >> $GITHUB_ENV

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        if: env.COMPILE_STATUS == '0'
        with:
          name: Xiaomi_Mi_Router_3G_Firmware_${{ env.COMMIT_DATE }}
          path: /workdir/openwrt/bin/targets/
          retention-days: 30
          if-no-files-found: ignore
  
      - name: Check Firmware Size
        if: env.COMPILE_STATUS == '0' 
        run: |
          cd /workdir/openwrt/bin/targets/ramips/mt7621
          echo "--- Firmware Files ---"
          ls -lh *.bin
          echo "--- Size Check ---"
          SIZE=$(stat -c%s "openwrt-ramips-mt7621-xiaomi_mi-router-3g-squashfs-sysupgrade.bin" 2>/dev/null || echo "0")
          MAX_SIZE=$((128 * 1024 * 1024)) # 128 MB
          # 建议留 5MB 余量给 JFFS2 日志和配置
          SAFE_MAX_SIZE=$((123 * 1024 * 1024)) 
          if [ "$SIZE" -gt "$SAFE_MAX_SIZE" ]; then
            echo "::warning::Firmware size ($SIZE bytes) is close to or exceeds safe limit for 128MB flash!"
          else
            echo "Firmware size is safe."
          fi
