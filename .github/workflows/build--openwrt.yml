name: Build OpenWrt for Xiaomi Mi Router 3G

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: "https://github.com/xinpenghan/immortalwrt"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          # 安装编译依赖
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-12 gperf wget curl rsync swig libncurses-dev
          sudo -E apt-get -y autoremove --purge
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUP /workdir

      - name: Clone Source Code
        run: |
          git clone -b $REPO_BRANCH $REPO_URL /workdir/openwrt
          cd /workdir/openwrt
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --format=%cd --date=short)" >> $GITHUB_ENV

      - name: Update Feeds
        run: |
          cd /workdir/openwrt
          
          # 【重要】添加第三方插件源 (kenzok8)，包含 passwall, turboacc, ddns-go 等
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
          
          # 更新并安装所有 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration (Xiaomi Mi Router 3G)
        run: |
          cd /workdir/openwrt
          # 生成配置文件
          cat > .config <<EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y
          
          # LuCI 基础
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          
          # --- 科学上网 (PassWall) ---
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_passwall=y
          # 核心后端 (注意：小米3G空间有限，建议二选一，若空间不足请注释掉其中一个)
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          # PassWall 依赖
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_dns2tcp=y
          CONFIG_PACKAGE_shadowsocks-rust=y
          CONFIG_PACKAGE_trojan-plus=y
          
          # --- 用户请求的新增插件 ---
          
          # Turbo ACC (网络加速)
          CONFIG_PACKAGE_luci-app-turboacc=y
          # 注意：turboacc 通常依赖 shortcut-fe 或 flow-offloading，这里假设默认依赖已处理
          
          # Watchcat (看门狗/自动重启)
          CONFIG_PACKAGE_luci-app-watchcat=y
          
          # DDNS (动态域名) - 官方原版
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          
          # DDNS-GO (更现代的DDNS工具)
          CONFIG_PACKAGE_luci-app-ddns-go=y
          
          # Netdata (系统监控)
          CONFIG_PACKAGE_luci-app-netdata=y
          
          # VLMCSD (KMS激活服务器)
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          
          EOF
          
          # 应用配置
          make defconfig
          
          # 【调试】打印关键配置状态，确认是否被识别
          echo "=== Check PassWall Config ==="
          grep PASSWALL .config || echo "PassWall NOT found in config!"
          echo "=== Check TurboACC Config ==="
          grep TURBOACC .config || echo "TurboACC NOT found in config!"
          echo "=== Check DDNS-GO Config ==="
          grep DDNS_GO .config || echo "DDNS-GO NOT found in config!"

      - name: Download Packages
        run: |
          cd /workdir/openwrt
          make download -j$(nproc)
          find dl -size -100c -exec ls -l {} \;
          find dl -size -100c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd /workdir/openwrt
          echo -e "$(nproc) thread compile"
          # 如果并行编译失败，则单线程详细输出以便排查
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_STATUS=$?" >> $GITHUB_ENV

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        if: env.COMPILE_STATUS == '0'
        with:
          name: Xiaomi_Mi_Router_3G_Firmware_${{ env.COMMIT_DATE }}
          path: /workdir/openwrt/bin/targets/
          retention-days: 30
          if-no-files-found: ignore
