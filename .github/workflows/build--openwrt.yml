name: Build OpenWrt for Xiaomi Mi Router 3G

于:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        默认: 'false'

env:
  REPO_URL: "https://github.com/xinpenghan/immortalwrt"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          # 【修复】针对 Ubuntu 24.04 替换已废弃和找不到的包，去掉无用包避免依赖冲突
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-12 gperf wget curl rsync swig libncurses-dev
          sudo -E apt-get -y autoremove --purge
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUP /workdir

      - name: Clone Source Code
        run: |
          git clone -b $REPO_BRANCH $REPO_URL /workdir/openwrt
          cd /workdir/openwrt
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --format=%cd --date=short)" >> $GITHUB_ENV

      - name: Update Feeds
        run: |
          cd /workdir/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration (Xiaomi Mi Router 3G)
        run: |
          cd /workdir/openwrt
          # 直接硬写生成小米 3G (MT7621) 的配置，避免因为缺少 config 文件导致报错
          cat > .config <<EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          
          # 4 PassWall (科学上网)
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_passwall=y
          # PassWall 核心后端
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_dns2tcp=y
          
          CONFIG_PACKAGE_luci-app-turboacc=y 
          CONFIG_PACKAGE_luci-app-watchcat=y 
          CONFIG_PACKAGE_luci-app-ddns=y 
          CONFIG_PACKAGE_luci-app-ddns-go=y 
          CONFIG_PACKAGE_luci-app-netdata=y 
          CONFIG_PACKAGE_luci-app-vlmcsd=y

          # 常用协议支持 (小米3G 建议精简，只保留最高效的)
          CONFIG_PACKAGE_shadowsocks-rust=y
          CONFIG_PACKAGE_trojan-plus=y
          # 以下协议若不需要可注释掉以节省空间
          # CONFIG_PACKAGE_hysteria is not set
          # CONFIG_PACKAGE_shadowsocksr-libev is not set
          # CONFIG_PACKAGE_v2ray-plugin is not set

          EOF
          make defconfig

      - name: Download Packages
        run: |
          cd /workdir/openwrt
          make download -j$(nproc)
          find dl -size -100c -exec ls -l {} \;
          find dl -size -100c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd /workdir/openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_STATUS=$?" >> $GITHUB_ENV

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        if: env.COMPILE_STATUS == '0'
        with:
          name: Xiaomi_Mi_Router_3G_Firmware_${{ env.COMMIT_DATE }}
          path: /workdir/openwrt/bin/targets/
          retention-days: 30
          if-no-files-found: ignore
